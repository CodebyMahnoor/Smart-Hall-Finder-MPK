<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - SmartHallFinder</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="bg-[#f3f6fb] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-md space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold font-serif text-slate-900">SmartHallFinder</h1>
        <p class="text-slate-500 text-sm">Super Admin Login</p>
    </div>

    <div th:if="${param.error}" class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-xs font-medium text-center">
        Invalid username or password. Please use the admin credentials.
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 space-y-6">
        <div>
            <h2 class="text-lg font-bold text-slate-900">Admin Access</h2>
            <p class="text-xs text-slate-500">Login with your username and password</p>
        </div>

        <form th:action="@{/admin/login}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input name="username" required type="text" value="admin" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:ring-indigo-500 focus:border-indigo-500"/>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input name="password" required type="password" placeholder="Enter admin password" class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:ring-indigo-500 focus:border-indigo-500"/>
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium text-sm py-2.5 rounded-xl transition-colors shadow-sm">
                Admin Sign In
            </button>
        </form>

        <div class="text-center">
            <a href="/halllogin" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 underline-offset-2 hover:underline">
                Hall Manager Login
            </a>
        </div>
    </div>

    <div class="text-center">
        <a href="/" class="text-xs font-medium text-slate-500 hover:text-slate-800">← Back to Directory</a>
    </div>
</div>
</body>
</html>
